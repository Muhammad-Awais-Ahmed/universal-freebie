services:
  - type: web
    name: universal-freebie-ai
    runtime: node
    plan: free
    rootDir: monitor-admin
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NVIDIA_NIM_API_KEY
        sync: false
      - key: NVIDIA_NIM_MODEL
        value: meta/llama-3.1-8b-instruct
      - key: ADMIN_TOKEN
        sync: false
      - key: AI_CLIENT_TOKEN
        sync: false