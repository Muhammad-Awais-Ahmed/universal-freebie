name: Automatic Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set Dynamic Version
        run: |
          $VERSION = "1.0.${{ github.run_number }}"
          npm version $VERSION --no-git-tag-version
          echo "Setting version to $VERSION"

      - name: Install Dependencies
        run: npm install

      - name: Decode Signing Certificate
        shell: pwsh
        run: |
          if ("${{ secrets.UF_CERT_BASE64 }}" -ne "") {
            $bytes = [Convert]::FromBase64String("${{ secrets.UF_CERT_BASE64 }}")
            New-Item -ItemType Directory -Path "certs" -Force | Out-Null
            [IO.File]::WriteAllBytes("certs/universal-freebie.pfx", $bytes)
            "CSC_LINK=$PWD/certs/universal-freebie.pfx" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "CSC_KEY_PASSWORD=uf-code-sign-2026" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Output "Certificate decoded"
          } else {
            "CSC_IDENTITY_AUTO_DISCOVERY=false" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Output "No certificate secret set - building unsigned"
          }

      - name: Build and Package App
        run: npm run package -- --publish=never

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
